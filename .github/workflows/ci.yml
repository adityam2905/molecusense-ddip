name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same system libraries as packages.txt (RDKit molecule drawing)
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libxext6

      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest
